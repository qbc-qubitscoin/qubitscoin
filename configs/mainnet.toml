# QubitsCoin Mainnet Configuration
# ────────────────────────────────────────────────────────────────────────────
# Copy this file to ~/.qbc/config.toml and adjust for your setup.

[chain]
network_id = 1
name       = "QubitsCoin Mainnet"

[node]
data_dir      = "~/.qbc"
keystore_file = "keystore.json"
miner_enabled = false   # set true only on authorized validator nodes
log_level     = "info"  # debug | info | warn | error

[p2p]
listen_addr   = "0.0.0.0:8765"
external_addr = ""          # leave empty to derive from listen_addr
max_peers     = 25
bootstrap_peers = [
  "qbc-seed1.qubitscoin.io:8765",
  "qbc-seed2.qubitscoin.io:8765",
  "qbc-seed3.qubitscoin.io:8765",
]

[rpc]
enabled      = true
listen_addr  = "127.0.0.1:8545"
cors_origins = []           # restrict in production e.g. ["https://myapp.io"]
read_timeout  = "30s"
write_timeout = "30s"

[storage]
blocks_dir = "blocks"   # relative to data_dir
state_dir  = "state"    # relative to data_dir

[metrics]
enabled     = false
listen_addr = "0.0.0.0:9090"

[upgrade]
release_url    = "https://api.github.com/repos/qbc-qubitscoin/qubitscoin/releases/latest"
check_interval = "1h"
auto_apply     = false  # never auto-restart in production without review
