<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QubitsCoin Web Wallet</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --primary: #58a6ff;
            --success: #238636;
            --danger: #da3633;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 {
            margin-top: 0;
            color: #fff;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        button {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #79c0ff; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-success:hover { background-color: #2ea043; }
        .address-box {
            font-family: monospace;
            word-break: break-all;
            background: #000;
            padding: 10px;
            border-radius: 4px;
        }
        #status { font-weight: bold; margin-bottom: 15px; }
        .green { color: #3fb950; }
        .red { color: #f85149; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h1>QubitsCoin Web Wallet</h1>
        <p>Quantum-Safe (ML-DSA-65) Web Interface</p>
        <div id="status" class="red">Offline (Not connected to Node)</div>
        
        <input type="text" id="rpcUrl" value="http://127.0.0.1:8545" placeholder="RPC URL">
        <button onclick="checkConnection()">Connect to Node</button>
    </div>

    <div class="panel" id="wallet-panel" style="display: none;">
        <h2>Wallet Status</h2>
        <p><strong>Address:</strong></p>
        <div class="address-box" id="address-display">Not loaded</div>
        
        <p><strong>Balance:</strong> <span id="balance-display">0</span> QBC</p>
        <button onclick="refreshBalance()">Refresh Balance</button>
    </div>

    <div class="panel" id="transfer-panel" style="display: none;">
        <h2>Send QBC</h2>
        <input type="text" id="toAddress" placeholder="To Address (Hex)">
        <input type="number" id="sendAmount" placeholder="Amount (QBC)" step="0.000000001">
        <button class="btn-success" onclick="sendTransaction()">Sign & Broadcast</button>
        <p id="tx-result"></p>
    </div>
</div>

<script>
    // Stub keys for demo purposes. In a real wallet, these would be generated 
    // locally via WebAssembly compiling ML-DSA-65, encrypted with AES-GCM and stored in IndexedDB.
    const DEMO_ADDRESS = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";
    let isConnected = false;

    async function rpcCall(method, params = []) {
        const url = document.getElementById('rpcUrl').value;
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data.result;
    }

    async function checkConnection() {
        try {
            const chainInfo = await rpcCall("qbc_chainInfo");
            document.getElementById('status').innerText = `Connected (Height: ${chainInfo.height})`;
            document.getElementById('status').className = 'green';
            isConnected = true;
            
            document.getElementById('wallet-panel').style.display = 'block';
            document.getElementById('transfer-panel').style.display = 'block';
            document.getElementById('address-display').innerText = DEMO_ADDRESS;
            await refreshBalance();
        } catch (e) {
            document.getElementById('status').innerText = `Connection Failed: ${e.message}`;
            document.getElementById('status').className = 'red';
        }
    }

    async function refreshBalance() {
        if (!isConnected) return;
        try {
            const result = await rpcCall("qbc_getBalance", [DEMO_ADDRESS]);
            const qubits = result.balance_qubits || 0;
            const qbc = qubits / 1000000000;
            document.getElementById('balance-display').innerText = qbc.toFixed(9);
        } catch(e) {
            console.error("Failed to get balance", e);
        }
    }

    async function sendTransaction() {
        const to = document.getElementById('toAddress').value;
        const amount = parseFloat(document.getElementById('sendAmount').value) * 1000000000;
        const resEl = document.getElementById('tx-result');
        
        resEl.innerText = "Simulating WebCrypto ML-DSA-65 Signature...";
        resEl.className = "";
        
        setTimeout(() => {
            // In a real implementation:
            // 1. Fetch nonce and baseFee
            // 2. Construct binary payload
            // 3. Call WASM ml-dsa-65 sign
            // 4. broadcast via qbc_sendRawTransaction
            resEl.innerText = "Transaction Broadcast Failed: WebAssembly Crypto Module Not Loaded in Demo";
            resEl.className = "red";
        }, 1500);
    }
</script>

</body>
</html>
